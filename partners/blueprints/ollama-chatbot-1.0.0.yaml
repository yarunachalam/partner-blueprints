apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  name: ollama-chatbot-1-0-0
  labels:
    ai-factory.suse.com/blueprint-name: ollama-chatbot
    ai-factory.suse.com/blueprint-version: 1.0.0
    ai-factory.suse.com/category: rag
spec:
  source: Partner
  displayName: Ollama Chatbot
  version: 1.0.0
  description: |
    A simple chatbot blueprint with Ollama as the local LLM backend and
    Open WebUI as the frontend. Ollama serves models locally; Open WebUI
    provides a browser-based chat interface connected to Ollama.
    Prerequisites: a default StorageClass (e.g. local-path or longhorn).
  components:
    - chartName: ollama
      chartRepo: application-collection
      chartVersion: 0.58.0
      values:
        image:
          registry: dp.apps.rancher.io
          repository: containers/ollama
        persistentVolume:
          enabled: true
          size: 30Gi
          storageClass: local-path
        service:
          type: ClusterIP
          port: 11434
    - chartName: open-webui
      chartRepo: application-collection
      chartVersion: 8.19.1
      values:
        image:
          registry: dp.apps.rancher.io
          repository: containers/open-webui
        ollama:
          enabled: false
        ollamaUrls:
          - http://ollama:11434
        persistence:
          enabled: true
          size: 20Gi
        ingress:
          enabled: true
          host: ollama-chatbot
          tls: true
